name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app make_token.py tests tools
      - run: python -m ruff check app make_token.py tests tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
      - run: docker compose -f docker-compose.example.yml config --quiet
      - run: DOCKERHUB_NAMESPACE=example docker compose -f docker-compose.image.example.yml config --quiet
      - run: docker compose -f docker-compose.config.example.yml config --quiet
      - run: BRIDGE_VERSION=1.1.0-rc.1 docker compose -f docker-compose.config.image.example.yml config --quiet
      - run: docker build -t gmail-bridge:ci .
      - run: docker run --rm gmail-bridge:ci python -m app.main --lang en --help
      - name: Verify Tokyo timezone inside the built slim image
        run: >-
          docker run --rm -e TZ=Asia/Tokyo
          --mount type=bind,source=${{ github.workspace }}/tests,target=/checks,readonly
          gmail-bridge:ci python -m unittest discover -s /checks -p test_container.py -v
  image-check:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: gmail-bridge:ci-check
      - name: Test the built image without publishing
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" gmail-bridge:ci-check python -m app.main --lang en --help
          docker run --rm --platform "$PLATFORM" -e TZ=Asia/Tokyo --mount type=bind,source="$PWD/tests",target=/app/tests,readonly --mount type=bind,source="$PWD/.github/workflows",target=/app/.github/workflows,readonly --mount type=bind,source="$PWD/make_token.py",target=/app/make_token.py,readonly gmail-bridge:ci-check python -m unittest discover -s /app/tests -v
