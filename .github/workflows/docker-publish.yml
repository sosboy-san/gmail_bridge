name: Publish Docker release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable or RC tag, e.g. v1.1.0-rc.1 (never main)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      major: ${{ steps.release.outputs.major }}
      rc: ${{ steps.release.outputs.rc }}
    steps:
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = context.eventName === 'workflow_dispatch' ? context.payload.inputs.tag : context.ref.replace('refs/tags/', '');
            const pattern = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            const rcPattern = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$/;
            const rc = rcPattern.test(tag);
            const match = tag.match(rc ? rcPattern : pattern);
            if (!match || match[1] === '0') throw new Error('Only stable or rc.N tags with MAJOR >= 1 are publishable');
            const tags = await github.paginate(github.rest.repos.listTags, {...context.repo, per_page: 100});
            const selected = tags.find(t => t.name === tag);
            if (!selected) throw new Error('Tag must already exist');
            const compare = (a, b) => {
              const av = a.slice(1).split('.').map(BigInt), bv = b.slice(1).split('.').map(BigInt);
              for (let i = 0; i < 3; i++) { if (av[i] !== bv[i]) return av[i] > bv[i] ? 1 : -1; }
              return 0;
            };
            if (!rc && tags.some(t => pattern.test(t.name) && compare(t.name, tag) > 0)) throw new Error('Older release blocked to prevent rolling back floating Docker tags');
            if (rc && tags.some(t => pattern.test(t.name) && compare(t.name, tag.split('-')[0]) >= 0)) throw new Error('RC blocked: matching or newer stable tag already exists');
            core.setOutput('rc', String(rc));
            core.setOutput('tag', tag);
            core.setOutput('sha', selected.commit.sha);
            core.setOutput('version', tag.slice(1));
            core.setOutput('minor', `${match[1]}.${match[2]}`);
            core.setOutput('major', match[1]);
  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: gmail-bridge:check
      - name: Check CLI and timezone on each architecture
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" gmail-bridge:check python -m app.main --lang en --help
          checks=(--mount type=bind,source="$PWD/tests",target=/app/tests,readonly --mount type=bind,source="$PWD/make_token.py",target=/app/make_token.py,readonly)
          # Older stable tags may predate this workflow; preserve manual bootstrap.
          if [[ -d "$PWD/.github/workflows" ]]; then
            checks+=(--mount type=bind,source="$PWD/.github/workflows",target=/app/.github/workflows,readonly)
          fi
          docker run --rm --platform "$PLATFORM" -e TZ=Asia/Tokyo "${checks[@]}" gmail-bridge:check python -m unittest discover -s /app/tests -v
  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment: dockerhub
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/gmail-bridge
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Validate Docker Hub configuration
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$NAMESPACE" && test -n "$USERNAME" && test -n "$TOKEN"
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Refuse to overwrite an existing version
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /tmp/image-inspect 2> /tmp/image-error; then
            echo 'This exact version is already published; refusing to overwrite it.'
            exit 1
          fi
          # Fail closed on authentication, network, or rate-limit errors.
          if ! grep -Eq 'manifest unknown|not found' /tmp/image-error; then
            cat /tmp/image-error
            exit 1
          fi
      - name: Select distribution tags
        id: distribution
        env:
          RC: ${{ needs.validate.outputs.rc }}
          MINOR: ${{ needs.validate.outputs.minor }}
          MAJOR: ${{ needs.validate.outputs.major }}
        shell: bash
        run: |
          versions=("$VERSION")
          if [[ "$RC" == false ]]; then
            versions+=("$MINOR" "$MAJOR" latest)
          fi
          {
            echo 'tags<<TAG_LIST'
            for tag in "${versions[@]}"; do echo "$IMAGE:$tag"; done
            echo TAG_LIST
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.distribution.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE:$VERSION — $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify all tags reference the published index
        env:
          RC: ${{ needs.validate.outputs.rc }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MINOR: ${{ needs.validate.outputs.minor }}
          MAJOR: ${{ needs.validate.outputs.major }}
        run: |
          versions=("$VERSION")
          if [[ "$RC" == false ]]; then versions+=("$MINOR" "$MAJOR" latest); fi
          for tag in "${versions[@]}"; do
            docker buildx imagetools inspect "$IMAGE:$tag" | grep -F "$DIGEST"
          done
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/manifest.json
          python -c 'import json; m=json.load(open("/tmp/manifest.json")); p={(x.get("platform",{}).get("os"),x.get("platform",{}).get("architecture")) for x in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= p'
