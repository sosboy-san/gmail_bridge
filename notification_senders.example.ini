# Copy to notification_senders.ini in the selected runtime directory.
# One exact address/domain per line; case insensitive. No regex or wildcards.
# Domains do not automatically include subdomains.
# Empty allowlist => no notifications in allowlist/combined modes.
# Empty blocklist => all uniquely identified senders in blocklist mode.
# combined: block always wins over allow, including an exact allow address.

[allowlist]
addresses =
    # customer@example.com
domains =
    # partner.example.com

[blocklist]
addresses =
    # newsletter@example.com
domains =
    # advertising.example.com
