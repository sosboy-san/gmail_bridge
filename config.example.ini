# Copy to config.ini. Never commit real settings or credentials.
# UTF-8. Values are literal: write % as %, not %%. Do not quote passwords.
# 日本語の項目説明と既定値: INSTALL.md / English: INSTALL.md#english

[general]
# ja / en; override with BRIDGE_LANGUAGE or --lang before the command.
language = ja

[imap]
# Required: your IMAP hostname, login name and password. Intentionally blank.
host =
port = 143
user =
password =
# STARTTLS only; implicit TLS on port 993 is not implemented.
mailbox = INBOX
# Source label. Blank preserves the original behavior: use the IMAP login name.
label = IMAP-Bridge
# Safe public default. Enable only after verifying Gmail and Drive copies.
# Disabling also suspends previously scheduled cleanup deletions.
delete_after_import = false
# Positive days after successful import/finalization; existing deadlines stay fixed.
delete_delay_days = 7

[gmail]
# Read/write: OAuth refresh overwrites this file. Relative to the working directory.
token_file = token.json
# Explicit stable label, independent of display language.
fallback_label = Attachments-in-Drive
# Optional: remove Gmail's SPAM label after import. This does not force INBOX.
force_not_spam = false

[drive]
# Folder name, not a Drive ID. Created/reused with drive.file access.
# Fallback runs automatically only when Gmail reports an invalid attachment.
folder = Gmail-IMAP-Bridge

[notification]
enabled = false
# Only ntfy is implemented. Notifications never contain the email body.
provider = ntfy
server_url = https://ntfy.sh
# Choose a private/protected topic on your server; no real topic in this example.
topic =
# Optional bearer token. Leave blank only if your server policy permits it.
token =

# Fixed operational values (not INI options):
# data/state.db; data/gmail_bridge.lock; data/last_cleanup_date
# Poll after each cycle: 60 seconds. Cleanup: once per successful local date.
# Daily SQLite backup: backups/db, UTC date, latest 14 backup files.
# run logs: logs, local date, remove files older than 30 days by modification time.
