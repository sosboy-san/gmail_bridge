# v1.1+ only. Prepare ./config yourself; no automatic init or path fallback.
services:
  gmail-bridge:
    # Set a published exact version (no leading v). RC images are not published yet.
    image: "${DOCKERHUB_NAMESPACE:-sosboy}/gmail-bridge:${BRIDGE_VERSION:?Set a published v1.1+ exact image version}"
    restart: unless-stopped
    init: true
    working_dir: /app
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    environment:
      TZ: "${TZ:-Asia/Tokyo}"
      BRIDGE_CONFIG_DIR: /config
    stop_grace_period: 2m
    volumes:
      - type: bind
        source: "${BRIDGE_HOST_CONFIG_DIR:-./config}"
        target: /config
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
